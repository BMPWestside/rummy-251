<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rummy 251">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<title>Rummy 251</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Cinzel+Decorative:wght@700;900&display=swap">
<style>
/* Layout: one column. Score sheet (players as rows, rounds as columns) on top, then standings, round entry, table controls.
   Look: deep navy night, frosted see-through panels with gold rims, each player in their own translucent colour. Single dark theme by choice. */
:root{
  --bg:#0a0f2a; --bg2:#1b1d4d; --glass:rgba(40,56,120,.28); --glass2:rgba(255,255,255,.06);
  --gold:#d9b46a; --gold-soft:rgba(217,180,106,.55); --fg:#f3f5ff; --muted:#aab3dd;
  --blue:rgba(86,146,214,.55); --blue-line:#7fb0ea;
  --ok:#7ee0a0; --ok-bg:rgba(110,214,140,.22); --drop:#9cc2ff; --drop-bg:rgba(100,150,255,.22);
  --mid:#ffd27a; --mid-bg:rgba(255,196,90,.22); --full:#ff9aa4; --full-bg:rgba(240,100,120,.25);
  --b1:rgba(255,226,120,.20); --b2:rgba(255,170,80,.24); --b3:rgba(255,120,80,.28); --b4:rgba(240,70,90,.34); --outbg:rgba(0,0,0,.45);
  --red:#ff8b95;
  --font:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:radial-gradient(120% 60% at 10% 0%, rgba(60,90,170,.35), transparent 60%), radial-gradient(100% 70% at 90% 100%, rgba(80,50,160,.35), transparent 60%), var(--bg);min-height:100%}
body{background:transparent;
  color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 12px;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--glass);border:1.5px solid var(--gold-soft);border-radius:24px;
  backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.25)}
header.top{display:flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:rgba(22,30,78,.72)}
.suits{display:flex;gap:4px;font-size:17px;font-family:'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif;font-variant-emoji:text;line-height:1;font-style:normal}
.suits i{font-style:normal}.suits .rd{color:#ff7b8a;text-shadow:0 0 8px rgba(255,90,110,.45)}.suits .bk{color:var(--gold);text-shadow:0 0 8px rgba(217,180,106,.4)}
header.top .sync{margin-left:2px}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 35% 30%, #f3d68f, #b98b3c);color:#1a1c3d;font-weight:900;font-size:18px;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
h1{font-weight:900;font-size:15px;margin:0;letter-spacing:2.5px;text-transform:uppercase;text-align:center;flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:none}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.rules{font-size:12px;color:var(--muted);text-align:center;letter-spacing:.3px;margin-top:-8px}
.synctext{font-size:12px;color:var(--muted);text-align:center;margin-top:-12px}
h2{font-weight:900;font-size:13px;margin:0;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.panel{padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
button{font:inherit;font-weight:800;cursor:pointer;border-radius:999px;border:1.5px solid var(--gold-soft);background:var(--glass2);color:var(--fg);padding:8px 16px}
button:hover{border-color:var(--gold)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.primary{background:linear-gradient(180deg, rgba(110,170,230,.7), rgba(60,110,180,.6));border-color:var(--gold)}
button.danger{color:var(--red)}
button.small{padding:5px 12px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number]{font:inherit;font-weight:700;background:rgba(255,255,255,.07);color:var(--fg);border:1.5px solid rgba(217,180,106,.35);border-radius:14px;padding:8px 12px;min-width:0}
input::placeholder{color:rgba(170,179,221,.7)}
input[type=number]{width:74px;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--mid);font-weight:700}
.err{font-size:13px;color:var(--red);font-weight:800}

/* score sheet: players are rows, rounds are columns */
.sheetwrap{overflow-x:auto;border-radius:16px;border:1px solid rgba(217,180,106,.25);background:rgba(10,14,40,.25)}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.07)}
tr:last-child td{border-bottom:0}
thead th{font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);background:rgba(20,26,66,.55)}
th.pl,td.pl{text-align:left;position:sticky;left:0;z-index:2;width:104px;min-width:104px;max-width:104px;overflow:hidden;text-overflow:ellipsis;background:#151b47}
td.pl{font-weight:900;color:var(--c)}
td.pl .sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px;box-shadow:0 0 8px var(--c)}
th.tot,td.tot{position:sticky;left:104px;z-index:2;background:#151b47;border-right:1px solid rgba(217,180,106,.35)}
td.tot{font-weight:900;font-size:17px}
td.tot.b1{background:linear-gradient(var(--b1),var(--b1)),#151b47}td.tot.b2{background:linear-gradient(var(--b2),var(--b2)),#151b47}td.tot.b3{background:linear-gradient(var(--b3),var(--b3)),#151b47}td.tot.b4{background:linear-gradient(var(--b4),var(--b4)),#151b47}td.tot.bout{background:linear-gradient(var(--outbg),var(--outbg)),#151b47}
td.stat{color:var(--muted);font-weight:700;font-size:13px}
td.rd{font-weight:800}
th.sep,td.sep{border-left:1px solid rgba(217,180,106,.25)}
td.c0{background:var(--ok-bg);color:var(--ok)}
td.c25{background:var(--drop-bg);color:var(--drop)}
td.c50{background:var(--mid-bg);color:var(--mid)}
td.c80{background:var(--full-bg);color:var(--full)}
td.na{color:rgba(170,179,221,.4)}
td.ev,th.ev{font-size:12px;color:var(--gold);font-weight:900}
td.b1{background:var(--b1)}td.b2{background:var(--b2)}td.b3{background:var(--b3)}td.b4{background:var(--b4)}td.bout{background:var(--outbg);color:var(--red)}
tr.outrow td:not(.pl):not(.tot){opacity:.65}
tr.outrow td.tot{color:var(--red)}
.seatno{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-right:7px;border-radius:999px;font-size:11px;font-weight:900;color:#141a44;background:var(--c, var(--gold));vertical-align:1px}
.erow .who b .seatno{color:#141a44;font-size:11px;font-weight:900}
.act{border-color:color-mix(in srgb, var(--c) 70%, transparent);background:color-mix(in srgb, var(--c) 16%, transparent);font-weight:700}
.act b,.an{color:var(--c);font-weight:900}
.seatpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.pickbtn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;text-align:left;
  background:color-mix(in srgb, var(--c) 14%, transparent);border:2px dashed color-mix(in srgb, var(--c) 60%, transparent)}
.pickbtn .num{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;flex:none;font-weight:900;font-size:13px;border:1.5px solid color-mix(in srgb, var(--c) 60%, transparent)}
.pickbtn .pn{font-weight:900;color:var(--c);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pickbtn.on{border-style:solid;background:color-mix(in srgb, var(--c) 26%, transparent)}
.pickbtn.on .num{background:var(--c);color:#141a44;border-color:var(--c)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(255,255,255,.2)}


/* score sheet: players are columns, rounds are rows, entry row under the totals */
table.pcols th,table.pcols td{padding:7px 4px;min-width:54px}
.sheetpanel{padding:10px}
table.pcols .rl{position:sticky;left:0;z-index:2;background:#151b47;min-width:40px;width:40px;text-align:center;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.5px;border-right:1px solid rgba(217,180,106,.3)}
table.pcols th.ph{color:var(--c);font-size:13px;letter-spacing:0;text-transform:none;vertical-align:bottom;max-width:90px}
table.pcols th.ph .seatno{margin:0 auto 4px;display:grid;width:max-content}
table.pcols th.ph .pn{display:block;overflow:hidden;text-overflow:ellipsis}
table.pcols th.pout{opacity:.55}
tr.totrow td.ptot{font-weight:900;font-size:19px;border-bottom:1px solid rgba(217,180,106,.35)}
td.ptot.pout{color:var(--red)}
tr.srow td{font-size:12px;color:var(--muted);font-weight:700;padding-block:4px}
tr.srow:last-of-type td,tr.srow + tr.erow2 td{border-bottom:1px solid rgba(217,180,106,.35)}
tr.erow2 td{background:rgba(255,255,255,.03);vertical-align:top;border-bottom:1px solid rgba(217,180,106,.35)}
tr.erow2 td.rl{color:var(--gold);font-size:13px}
.ecell{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.ecell input[type=number]{width:100%;max-width:40px;margin:0 auto;height:24px;padding:0;-moz-appearance:textfield;appearance:textfield;border-radius:10px;border-color:color-mix(in srgb, var(--c) 60%, transparent);font-size:16px}
.qs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.qs .q{padding:5px 0;font-size:11px;min-width:0;border-radius:10px}
.pv{font-size:12px;font-weight:800;color:var(--muted)}
.pv.bust{color:var(--red)}


.sheetinner{min-width:calc(40px + var(--n) * 56px)}
table.pcols{table-layout:fixed;width:100%}
table.pcols col.c-rl{width:40px}
table.pcols th,table.pcols td{min-width:0;overflow:hidden;text-overflow:ellipsis}
.roundscroll{max-height:111px;overflow-y:auto;border-top:1px solid rgba(217,180,106,.35)}
.roundscroll td{height:37px}
.roundscroll tr:last-child td{border-bottom:0}


.bb{height:42px;padding:0 18px;font-size:15px;display:inline-flex;align-items:center}
table.pcols th.ph,table.pcols td:not(.rl){border-left:1px solid rgba(217,180,106,.22)}
table.pcols col.c-rl + col{}


tr.srow.s-R td{color:var(--ok)}tr.srow.s-D td{color:var(--drop)}tr.srow.s-M td{color:var(--mid)}tr.srow.s-F td{color:var(--full)}
tr.srow.s-R td.rl,tr.srow.s-D td.rl,tr.srow.s-M td.rl,tr.srow.s-F td.rl{opacity:1}
tr.erow2 td{padding-bottom:6px}

.ecell input::-webkit-outer-spin-button,.ecell input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.phn{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
table.pcols th.ph .phn .pn{min-width:0}
.dealer{flex:none;display:inline-grid;place-items:center;width:16px;height:16px;font-size:10px;font-weight:900;border-radius:50%}
.dealer{background:var(--gold);color:#141a44}
.picker{border:1px solid var(--gold-soft);color:var(--gold)}
.hint{font-size:12px;color:var(--gold);font-weight:800}


.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:999px}
.tab{border-color:transparent;background:transparent;color:var(--muted);font-size:13px;padding:4px 0}
.tab.on{background:linear-gradient(180deg, rgba(110,170,230,.7), rgba(60,110,180,.6));border-color:var(--gold);color:var(--fg)}
table.pcols.stats tr.srow td{font-size:18px;font-weight:900;padding-block:12px}
table.pcols.stats tr.srow td.rl{font-size:12px}


.stickytop{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;display:flex;flex-direction:column;gap:6px;
  margin-inline:-16px;padding:6px 16px;background:rgba(10,15,42,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#tabsbar:empty{display:none}
.dealer{width:13px;height:17px;border-radius:3px;font-size:10px;line-height:1;background:linear-gradient(160deg,#fff7e2,#e9d3a0);color:#141a44;box-shadow:0 0 0 1px var(--gold),0 1px 3px rgba(0,0,0,.4);font-family:'Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif}
select.psel{width:100%;max-width:56px;height:30px;margin:0 auto;display:block;font:inherit;font-weight:900;font-size:16px;text-align:center;text-align-last:center;
  color:var(--fg);background:rgba(255,255,255,.07);border:1.5px solid color-mix(in srgb, var(--c) 60%, transparent);border-radius:10px;padding:0 2px;-webkit-appearance:none;appearance:none}
select.psel.c0{color:var(--ok);background:var(--ok-bg)}select.psel.c25{color:var(--drop);background:var(--drop-bg)}
select.psel.c50{color:var(--mid);background:var(--mid-bg)}select.psel.c80{color:var(--full);background:var(--full-bg)}
select.psel option{background:#151b47;color:var(--fg)}
tr.erow2 td{vertical-align:middle;padding-block:8px}


/* compact buttons: one size everywhere on the Score tab */
.bb{height:32px;padding:0 12px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btnrow.two{grid-template-columns:1fr 1fr}
.btnrow .confirm.full{grid-column:1/-1}
.tpanel{padding:12px 14px;gap:10px}
.tpanel h2{font-size:12px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.addrow input{height:32px;padding:0 12px;font-size:14px;border-radius:999px}
.addbtn{background:linear-gradient(135deg,#f2cd9e,#e3a56a);border-color:rgba(255,230,190,.8);color:#fff;text-shadow:0 1px 2px rgba(120,60,10,.45)}
.addbtn:disabled{opacity:.45}
.tpanel details summary{font-size:13px}
.act{height:32px;font-size:13px;padding:0 12px}
/* colours from the reference: blue top bar, coral switch, charcoal selected tab */
header.top{background:linear-gradient(135deg, rgba(140,190,240,.92), rgba(92,150,220,.92));border-color:rgba(200,225,255,.7)}
header.top h1{font-family:"Cinzel Decorative",Georgia,serif;font-weight:900;font-size:20px;letter-spacing:1.5px;text-transform:none;line-height:1.15;background:linear-gradient(180deg,#fffbe6 0%,#ffe18a 38%,#c8922e 52%,#8a5d14 62%,#f6d47a 85%,#fff3c4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #3d2706) drop-shadow(0 0 1px #3d2706) drop-shadow(0 2px 3px rgba(10,20,60,.5))}
header.top .suits .bk{color:#10163d;animation:glowBk 2s ease-in-out infinite}
header.top .suits .rd{color:#ff2a45;animation:glowRd 2s ease-in-out infinite}
header.top .suits i{display:inline-block}
header.top .suits:first-child i:nth-child(2),header.top .suits:last-child i:nth-child(2){animation-delay:.5s}
header.top .suits:last-child i:first-child{animation-delay:1s}
header.top .suits:last-child i:nth-child(2){animation-delay:1.5s}
@keyframes glowRd{0%,40%,100%{text-shadow:0 0 1px rgba(255,40,70,.6);transform:scale(1)}
  10%{text-shadow:0 0 1px #fff,0 0 3px #ff2a45,0 0 5px #ff2a45;transform:scale(1.28)}
  20%{text-shadow:0 0 1px rgba(255,40,70,.8);transform:scale(.94)}
  30%{text-shadow:0 0 1px #fff,0 0 3px #ff2a45,0 0 5px #ff2a45;transform:scale(1.18)}}
@keyframes glowBk{0%,40%,100%{text-shadow:0 0 1px rgba(0,0,0,.6);transform:scale(1)}
  10%{text-shadow:0 0 1px #000,0 0 3px #000,0 0 5px #000;transform:scale(1.28)}
  20%{text-shadow:0 0 1px rgba(0,0,0,.8);transform:scale(.94)}
  30%{text-shadow:0 0 1px #000,0 0 3px #000,0 0 5px #000;transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){header.top .suits i{animation:none!important}}
header.top .dot{background:rgba(255,255,255,.6)}header.top .dot.live{background:#7dffb0;box-shadow:0 0 6px #7dffb0}
.tabs{background:linear-gradient(135deg, rgba(232,160,160,.92), rgba(212,112,112,.92));border-color:rgba(255,210,210,.7)}
.tab{color:rgba(255,255,255,.88)}
.tab.on{background:linear-gradient(135deg,#e892b2,#d2668a);border-color:rgba(255,220,232,.75);color:#fff;text-shadow:0 1px 2px rgba(120,30,60,.35)}
.dealer.red{color:#d81e36}
input.pin{width:100%;max-width:56px;height:30px;margin:0 auto;display:block;font-size:16px;font-weight:900;text-align:center;padding:0 2px;border-radius:10px;
  border:1.5px solid color-mix(in srgb, var(--c) 70%, transparent);-moz-appearance:textfield;appearance:textfield}
input.pin::-webkit-outer-spin-button,input.pin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}


/* fit each tab on one phone screen */
.wrap{gap:10px}
.stack{display:flex;flex-direction:column;gap:6px}
.stack .bb{width:100%}
.panel.sheetpanel{padding:8px;gap:8px}
.tpanel{padding:10px 12px;gap:8px}
table.pcols.stats tr.srow td{padding-block:6px;font-size:16px}
.tpanel .setgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tpanel .setgrid label{font-size:11px;gap:2px}
.tpanel .setgrid input{height:30px;padding:0 6px;text-align:center}
.tpanel .setgrid .bb{width:100%}
.hist{max-height:112px;overflow-y:auto;font-size:13px}
.hist div{padding-block:4px}


.banner{padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:nowrap;
  background:linear-gradient(135deg, rgba(217,180,106,.35), rgba(217,180,106,.12));border-color:var(--gold)}
.banner b{font-weight:900;font-size:22px}
.banner .trophy{height:34px;width:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,25,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px}
.modalbox{width:100%;max-width:420px}
.modalbox .panel{background:rgba(25,33,85,.92)}
.rjpanel .row{gap:6px}
.rjpanel .confirm{padding:6px 8px;gap:6px}

.wrap{gap:8px}
.stickytop{padding-block:4px}
.rjpanel{padding:8px 12px}
.rjpanel h2{margin-right:2px}

.rjb{width:100%;max-width:60px;height:30px;margin:0 auto;display:block;padding:0;font-size:12px;font-weight:900;border-radius:10px;
  color:var(--c);border:1.5px dashed color-mix(in srgb, var(--c) 70%, transparent);background:color-mix(in srgb, var(--c) 12%, transparent)}
.gub{display:block;margin:4px auto 0;height:22px;padding:0 6px;font-size:10px;font-weight:900;border-radius:8px;color:var(--red);border-color:rgba(255,139,149,.5);background:rgba(240,90,110,.12)}
.sheetpanel .hint{text-align:center}
.tablehead{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:0;border-radius:0;color:inherit}
.tablehead .chev{color:var(--muted);font-size:14px}
.tpanel.closed{padding-block:10px}

.sheetinner{min-width:calc(36px + var(--n) * 44px)}
table.pcols col.c-rl{width:36px}
table.pcols th,table.pcols td{padding-inline:3px}
tr.totrow td.ptot{font-size:clamp(15px, 4.4vw, 19px)}
.rjb{font-size:11px}
select.psel,input.pin{max-width:52px}
.rjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rjgrid .act{width:100%;justify-content:center;display:inline-flex;align-items:center;gap:4px}
.rjc{display:grid;grid-template-columns:1fr 32px;gap:4px}
.rjc .bb{padding:0 6px}
.rjgrid .confirm{grid-column:1/-1;justify-content:space-between}
.rmgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rmgrid .bb{padding:0 6px;overflow:hidden;text-overflow:ellipsis}

/* button colours from the reference palette */

//  1. anyone on compulsory (no drops left) gets back one stake (A$20), even if they rejoined
//  2. the rest is shared by the others: each gets A$ per drop for every drop they have above the lowest,
//     then whatever is left is shared equally
function splitCalc(c){
  const s = c.s, total = pool(c), ps = c.active;
  if (!ps.length) return [];
  const rows = ps.map(p => ({id:p.id, name:p.name, total:p.total, drops:Math.max(0, Math.floor((s.limit - 1 - p.total) / s.drop)), paid:s.stake}));
  let left = total;
  const refund = rows.filter(r => r.drops === 0), sharers = rows.filter(r => r.drops > 0);
  if (sharers.length === 1 && refund.length){
    // only one player still has drops: he takes A$ per drop first, then everyone shares the rest equally
    const a = sharers[0]; a.extra = Math.min(a.drops * s.dropValue, left); left -= a.extra;
    const each = left / rows.length;
    rows.forEach(r => { r.amt = Math.round((r.extra || 0) + each); });
  } else if (sharers.length){
    refund.forEach(r => { r.amt = Math.min(r.paid, total / rows.length); r.note = 'refund'; left -= r.amt; });
    const low = Math.min(...sharers.map(r => r.drops));
    sharers.forEach(r => { r.extra = (r.drops - low) * s.dropValue; });
    // drop money can't be more than what's left in the pot: scale it down if it is
    const ex = sharers.reduce((t, r) => t + r.extra, 0);
    if (ex > left) sharers.forEach(r => { r.extra = r.extra * left / ex; });
    sharers.forEach(r => { left -= r.extra; });
    const each = left / sharers.length;
    sharers.forEach(r => { r.amt = Math.round(r.extra + each); });
  } else {
    rows.forEach(r => { r.amt = Math.round(total / rows.length); });
  }

  const wr = wrap.getBoundingClientRect(), ar = app.getBoundingClientRect();
  const used = ar.bottom - wr.top + wrap.scrollTop;          // content height inside the screen
  const free = wrap.clientHeight - used - 12 - 12 + 6;       // minus bottom padding and the gap above the logo
  if (free < 50) return;
  lg.style.height = Math.min(260, free - 4) + 'px'; lg.style.display = 'block';
}

function sheetView(c){
  const s = c.s;
  const dealSuit = [{ch:'♠'}, {ch:'♥', red:true}, {ch:'♦', red:true}, {ch:'♣'}][c.rounds % 4];
  const dealerId = c.winner ? null : upcomingDealer(game, c);
  const pickerId = dealerId ? nextActive(game.players.map(p => p.id), new Set(c.active.map(p => p.id)), dealerId) : null;
  const cols = c.list.filter(p => p.inGame || p.rounds);
  const entering = !c.winner && !game.split && c.active.length >= 2 && canWrite;
  const activeIds = new Set(c.active.map(p => p.id));
  const head = cols.map((p, i) => `<th class="ph ${p.out?'pout':''}" style="--c:${hue(p.id)}"><span class="phn"><span class="pn">${esc(dn(p.name))}</span>${p.id === dealerId ? `<span class="dealer ${dealSuit.red ? 'red' : ''}" title="Deals this round">${dealSuit.ch}&#xFE0E;</span>` : ''}</span></th>`).join('');

  const showEntry = entering;
  const rummyBy = Object.keys(draft).find(k => draft[k] !== '' && draft[k] != null && Number(draft[k]) === 0 && activeIds.has(k)) || null;
  const giveUpOk = !c.canEnter && c.anyOut && c.active.length > 1;
  let scorePopup = null;
  const entryRow = !showEntry ? '' : `<tr class="erow2"><td class="rl">${c.rounds + 1}</td>${cols.map(p => {
    if (!activeIds.has(p.id)){
      if (false) return `<td class="ent"><button class="rjb" style="--c:${hue(p.id)}" data-act="rejoin" data-p="${p.id}" aria-label="Rejoin ${esc(dn(p.name))} at ${c.entryScore}">↺${c.entryScore}</button></td>`;
      return '<td class="na">·</td>';
    }
    const guBtn = false ? `<button class="gub" data-act="${ui.confirm === 'gu-' + p.id ? 'giveup' : 'ask'}" data-c="gu-${p.id}" data-p="${p.id}">${ui.confirm === 'gu-' + p.id ? 'Sure?' : 'Give up'}</button>` : '';
    const raw = draft[p.id] ?? '';
    const specials = ['0', String(s.drop), String(s.mid), String(s.full)];
    const cls = raw === '' ? '' : cellClass(Number(raw), s);
    if (ui.manual[p.id] || (raw !== '' && !specials.includes(String(raw)))){
      return `<td class="ent" style="--c:${hue(p.id)}"><input type="number" class="pin" inputmode="numeric" min="2" max="${s.full}" id="pts-${p.id}" data-pts="${p.id}" value="${esc(raw)}" placeholder="2–${s.full - 1}" aria-label="Points for ${esc(dn(p.name))}">${guBtn}</td>`;
    }
    const compulsory = p.total > c.maxEntry - 1 && p.total < s.limit; // 226–250: must play, no drop or middle drop
    const noMid = p.total > 200 && p.total < s.limit; // over 200: no middle drop
    const opts = [['', '–'], ['manual', '✎ 2–' + (s.full - 1)], ['0', 'R'], [String(s.drop), 'D'], [String(s.mid), 'MD'], [String(s.full), 'FC']];
    const mustR = !rummyBy && c.active.every(q => q.id === p.id || (draft[q.id] !== undefined && draft[q.id] !== '' && Number(draft[q.id]) !== 0));
    const off = v => (mustR && v !== '0' && v !== '') || (v === '0' && rummyBy && rummyBy !== p.id) || (v === String(s.drop) && compulsory) || (v === String(s.mid) && (compulsory || noMid));
    if (ui.popup === 'score' && ui.scoreFor === p.id) scorePopup = { p, raw, off };
    return `<td class="ent" style="--c:${hue(p.id)}"><button class="psel ${cls}" id="pts-${p.id}" data-act="score-open" data-p="${p.id}" aria-label="Points for ${esc(dn(p.name))}">${raw === '' ? '–' : scoreLabel(Number(raw), s)}</button>${guBtn}</td>`;
  }).join('')}</tr>`;
  const colgroup = `<colgroup><col class="c-rl">${cols.map(() => '<col>').join('')}</colgroup>`;
  let rn = 0;
  // one row per round; everything between two rounds (joins, rejoins, give-ups) shares one row
  const groups = [];
  game.log.forEach((e, li) => {
    if (e.t === 'r') groups.push({r:e, li});
    else { const last = groups[groups.length-1]; if (last && last.ev) last.ev.push(e); else groups.push({ev:[e]}); }
  });
  const logRows = groups.map(gr => {
    if (gr.r){ rn++; const e = gr.r; const ed = canWrite && !c.winner && !game.split; return `<tr><td class="rl">${rn}</td>${cols.map(p => p.id in e.s ? `<td class="rd ${cellClass(e.s[p.id], s)} ${ed ? 'editable' : ''}" ${ed ? `data-act="edit-cell" data-li="${gr.li}" data-p="${p.id}"` : ''}>${scoreLabel(e.s[p.id], s)}</td>` : `<td class="na">·</td>`).join('')}</tr>`; }
    const label = gr.ev.every(e => e.t === 'g') ? 'GU' : gr.ev.every(e => e.t === 'a') ? 'IN' : 'RJ';
    return `<tr><td class="rl ev">${label}</td>${cols.map(p => {
      const mine = gr.ev.filter(e => e.p === p.id);
      if (!mine.length) return '<td></td>';
      return `<td class="ev">${mine.map(e => e.t === 'g' ? '✕' : '↺' + e.to).join(' ')}</td>`;
    }).join('')}</tr>`;
  }).reverse().join('');
  return `<section class="glass panel sheetpanel">
    <div class="sheetwrap" id="sheetwrap"><div class="sheetinner" style="--n:${cols.length}">
      <table class="pcols">${colgroup}
      <thead><tr><th class="rl bankcell">${(() => { const bp = game.banker && game.players.find(x => x.id === game.banker); return bp ? `<span class="banker" title="Holds the money" aria-label="${esc(dn(bp.name))} holds the money">$</span><span class="bname" style="--c:${hue(bp.id)}">${esc(dn(bp.name))}</span>` : ''; })()}</th>${head}</tr></thead>
      <tbody>
        <tr class="totrow"><td class="rl">S</td>${cols.map(p => `<td class="ptot ${band(p.total,s)} ${p.out?'pout isout':''}">${p.out ? (cols.length >= 6 ? 'O' : 'OUT') : p.total}</td>`).join('')}</tr>

    </div>` : ''}
  </section>${scorePopup ? (() => { const {p, raw, off} = scorePopup;
    const opt = (v, l, cls) => `<button class="sopt ${cls} ${String(raw) === v ? 'cur' : ''}" data-act="score-set" data-p="${p.id}" data-v="${v}" ${off(v) ? 'disabled' : ''}>${l}</button>`;
    return `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel" style="--c:${hue(p.id)}">
      <div class="row spread"><h2 style="color:var(--c)">${esc(dn(p.name))} · ${p.total}</h2><button class="bb" data-act="popup-close">✕</button></div>
      <div class="sgrid">${opt('0','R','c0')}${opt(String(s.drop),'D','c25')}${opt(String(s.mid),'MD','c50')}${opt(String(s.full),'FC','c80')}</div>
      <div class="btnrow two"><button class="sopt cman" data-act="score-manual" data-p="${p.id}" ${off('manual') ? 'disabled' : ''}>✎ Type 2–${s.full - 1}</button><button class="sopt cclr" data-act="score-set" data-p="${p.id}" data-v="">Clear</button></div>
    </section></div></div>`; })() : ''}${ui.popup === 'edit' && ui.edit ? editPopup(c) : ''}`;
}

function gameView(){
  const c = compute(game), s = c.s;
  const showList = c.list.filter(p => p.inGame);
  const leadId = c.active.length > 1 ? c.active.reduce((a,b)=> b.total < a.total ? b : a).id : null;

  // Give up & Rejoin: always shown during a game; each button opens a pop-up
  const rjList = showList.filter(p => p.canRejoin && c.canEnter);
  // only players who would come back lower than their current score are offered a give up
  // give up is offered to the smallest group of top scorers who, by giving up together, can all rejoin lower
  //   e.g. 249 alone would rejoin at 231 (blocked), but 249 + 230 together rejoin at 206
  const guPreview = ids => compute(Object.assign({}, game, {log:[...game.log, ...ids.map(id => ({t:'g', p:id}))]}));
  let guList = [], guEntry = null;
  if (c.active.length > 2){
    const desc = [...c.active].sort((a, b) => b.total - a.total);
    for (let k = 1; k < desc.length; k++){
      const cut = desc[k - 1].total;
      const grp = desc.filter(q => q.total >= cut);
      if (grp.length >= desc.length) break;
      const pv = guPreview(grp.map(q => q.id));
      if (pv.canEnter && pv.entryScore < cut){ guList = grp; guEntry = pv.entryScore; break; }
      k = grp.length;   // skip past ties
    }
  }

  let popup = '';
  if (ui.popup === 'giveup' && guList.length){
    const sel = ui.guSel && guList.find(p => p.id === ui.guSel) ? ui.guSel : null;
    const pv = sel ? giveUpPreview(sel) : null;
    const selP = sel ? c.P[sel] : null;
    const others = selP ? guList.filter(q => q.id !== sel) : [];
    const soloOk = pv && pv.canEnter && pv.entryScore < selP.total;
    popup = `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel">
      <div class="row spread"><h2>Give up</h2>${pv ? `<span class="hint">${soloOk ? 'Rejoin at ' + pv.entryScore : others.length ? 'Rejoin at ' + guEntry + ' if ' + others.map(q => esc(dn(q.name))).join(' & ') + ' also give' + (others.length > 1 ? '' : 's') + ' up' : 'Rejoin blocked (' + pv.entryScore + ')'}</span>` : ''}</div>
      <div class="rjgrid">${guList.map(p => `<button class="act ${sel === p.id ? 'sel' : ''}" style="--c:${hue(p.id)}" data-act="gu-pick" data-p="${p.id}"><b>${esc(dn(p.name))}</b> ${p.total}</button>`).join('')}</div>
      <div class="btnrow two"><button class="bb" data-act="popup-close">Cancel</button><button class="bb" data-act="giveup" data-p="${sel || ''}" ${sel ? '' : 'disabled'}>Give up</button></div>
    </section></div></div>`;
  } else if (ui.popup === 'rejoin' && rjList.length){
    popup = `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel">
      <div class="row spread"><h2>Rejoin at ${c.entryScore}</h2>${rjList.length > 1 ? '<span class="hint">Highest card first</span>' : ''}</div>
      <div class="rjgrid">${rjList.map(p => `<button class="act" style="--c:${hue(p.id)}" data-act="rejoin" data-p="${p.id}"><b>${esc(dn(p.name))}</b> rejoin</button>`).join('')}</div>
      <div class="btnrow two"><span></span><button class="bb" data-act="popup-close">Done</button></div>
    </section></div></div>`;
  }
  const actions = canWrite && !c.winner && !game.split ? `<section class="glass panel tpanel rjpanel">
    <h2>Give up &amp; Rejoin</h2>
    <div class="btnrow two"><button class="bb gbtn" data-act="popup" data-w="giveup" ${guList.length ? '' : 'disabled'}>Give up</button><button class="bb rbtn" data-act="popup" data-w="rejoin" ${rjList.length ? '' : 'disabled'}>Rejoin${rjList.length ? ` (${rjList.length})` : ''}</button></div>
  </section>${popup}` : '';

  const banner = c.winner ? `<div class="glass banner"><img class="trophy" src="${TROPHY}" alt=""><div class="bwin"><b>${esc(dn(c.winner.name))} wins</b><span>${money(pool(c))}</span></div><img class="trophy" src="${TROPHY}" alt=""></div>`
    : game.split ? `<div class="glass banner"><img class="trophy" src="${TROPHY}" alt=""><div class="bwin"><b>Pot split</b><span>${game.split.map(r => `${esc(dn(r.name))} ${money(r.amt)}`).join(' · ')}</span></div><img class="trophy" src="${TROPHY}" alt=""></div>` : '';
  // money section for the Setup tab
  const rowsSplit = !c.winner && !game.split && c.active.length >= 2 ? splitCalc(c) : [];
  const settle = settlement(game, c);
  const moneyView = `<section class="glass panel tpanel">
    ${settle ? `<button class="tablehead" data-act="sec-toggle" data-k="potOpen"><h2>Pot</h2><span class="row" style="gap:8px"><b class="pot">${money(pool(c))}</b><span class="chev">${ui.potOpen ? '▲' : '▼'}</span></span></button>` : `<div class="row spread"><h2>Pot</h2><b class="pot">${money(pool(c))}</b></div>`}
    ${settle && ui.potOpen ? `<table class="splitt"><thead><tr><th></th><th>Paid</th><th>Gets</th><th>Net</th></tr></thead><tbody>${settle.map(r => `<tr style="--c:${hue(r.id)}"><td class="sn">${esc(dn(r.name))}</td><td>${money(r.paid)}</td><td class="sa">${money(r.got)}</td><td class="${r.net > 0 ? 'pos' : r.net < 0 ? 'neg' : ''}">${r.net > 0 ? '+' : r.net < 0 ? '−' : ''}${money(Math.abs(r.net))}</td></tr>`).join('')}</tbody></table>` : ''}
    ${rowsSplit.length && canWrite ? `<div class="btnrow two"><button class="bb" data-act="popup" data-w="split">Split the pot</button><button class="bb" data-act="msplit-open">Manual split</button></div>` : ''}
  </section>${ui.popup === 'msplit' && rowsSplit.length ? (() => { const left = pool(c) - rowsSplit.reduce((a, r) => a + (Number(ui.mSplit[r.id]) || 0), 0); return `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel">

      <table class="splitt"><thead><tr><th></th><th>Score</th><th>Gets A$</th></tr></thead>
        <tbody>${rowsSplit.map(r => `<tr style="--c:${hue(r.id)}"><td class="sn">${esc(dn(r.name))}</td><td>${r.total}</td><td><input class="msin" type="number" inputmode="numeric" min="0" step="1" data-msplit="${r.id}" value="${esc(String(ui.mSplit[r.id] ?? ''))}" style="width:80px;text-align:center"></td></tr>`).join('')}</tbody></table>
      ${ui.msg ? `<div class="hint" id="msplit-err" style="color:var(--red);text-align:center">${esc(ui.msg)}</div>` : ''}
      <div class="btnrow two"><button class="bb" data-act="popup-close">Cancel</button><button class="bb primary" data-act="msplit-confirm">Confirm split</button></div>
    </section></div></div>`; })() : ''}${ui.popup === 'split' && rowsSplit.length ? `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel">
      <div class="row spread"><h2>Split ${money(pool(c))}</h2><span class="hint">${money(c.s.dropValue)} per drop</span></div>
      <table class="splitt"><thead><tr><th></th><th>Score</th><th>Drops</th><th>Gets</th></tr></thead>
        <tbody>${rowsSplit.map(r => `<tr style="--c:${hue(r.id)}"><td class="sn">${esc(dn(r.name))}</td><td>${r.total}</td><td>${r.drops}</td><td class="sa">${money(r.amt)}${r.note ? '<small> back</small>' : ''}</td></tr>`).join('')}</tbody></table>
      <div class="btnrow two"><button class="bb" data-act="popup-close">Cancel</button><button class="bb primary" data-act="split-confirm">Confirm split</button></div>
    </section></div></div>` : ''}`;


  const entry = '';

    </div>
    ${c.rounds === 0 ? `<div class="rmgrid">${game.players.map(p=>`<button class="bb danger" data-act="remove" data-p="${p.id}" aria-label="Remove ${esc(p.name)}">✕ ${esc(dn(p.name))}</button>`).join('')}</div>` : ''}
    ${ui.confirm === 'new-same' ? `<div class="confirm">Finish this game and start again with the same players?<button class="bb primary" data-act="new-same">Start new game</button><button class="bb" data-act="cancel">Cancel</button></div>`

      : `<div class="stack"><button class="bb" data-act="ask" data-c="new-same">New game, same players</button><button class="bb" data-act="ask" data-c="new-fresh">New game, new players</button></div>`}
    `}
  </section>` : '';

  const tab = ui.tab === 'stats' ? 'stats' : 'score';

  ui.tabsHtml = tabs;
  // when someone wins, move to Setup after 4 seconds (once per finished game)

}

// every finished game (saved history plus the current one if it has ended)
function finishedGames(){
  const list = history.map(h => ({at:h.endedAt, rounds:h.rounds, winner:h.winner, pot:h.pot, money:h.money, results:h.results || [], split:h.split}));
  if (game && game.log && game.log.length){
    const c = compute(game);
    if (c.winner || game.split) list.unshift({at:new Date().toISOString(), rounds:c.rounds, winner:c.winner ? c.winner.name : null, pot:pool(c), money:settlement(game, c), split:game.split || null,
      results:c.list.filter(p => p.inGame || p.rounds).map(p => ({name:p.name, total:p.total, out:p.out, rejoins:p.rejoins, R:p.R, D:p.D, M:p.M, F:p.F})), current:true});
  }
  return list;
}
function seasonView(){
  const games = finishedGames();
  if (!games.length) return `<section class="glass panel tpanel"><div class="row spread"><h2>Season</h2><span class="hint">fills in after the first finished game</span></div></section>`;
  const T = {};
  for (const gm of games){
    for (const r of gm.results){
      const t = T[r.name] = T[r.name] || {name:r.name, games:0, wins:0, R:0, net:0, hasMoney:false};
      t.games++; t.R += r.R || 0;
      if (gm.winner === r.name) t.wins++;
      const m = (gm.money || []).find(x => x.name === r.name);
      if (m){ t.net += m.net; t.hasMoney = true; }
    }
  }
  const rows = Object.values(T).sort((a, b) => b.net - a.net || b.wins - a.wins);
  const colorOf = name => { const p = game && game.players.find(x => x.name === name); return p ? hue(p.id) : 'var(--fg)'; };
  return `<section class="glass panel tpanel">
    <button class="tablehead" data-act="sec-toggle" data-k="seasonOpen"><h2>Season</h2><span class="row" style="gap:8px"><span class="hint">${games.length} game${games.length === 1 ? '' : 's'}${ui.seasonOpen ? ' · tap a name' : ''}</span><span class="chev">${ui.seasonOpen ? '▲' : '▼'}</span></span></button>
    ${ui.seasonOpen ? `<table class="splitt season"><thead><tr><th></th><th>Played</th><th>Won</th><th>R</th><th>Net</th></tr></thead>
      <tbody>${rows.map(t => `<tr style="--c:${colorOf(t.name)}" data-act="player-hist" data-n="${esc(t.name)}"><td class="sn">${esc(dn(t.name))}</td><td>${t.games}</td><td>${t.wins}</td><td>${t.R}</td><td class="${t.net > 0 ? 'pos' : t.net < 0 ? 'neg' : ''}">${t.hasMoney ? (t.net > 0 ? '+' : t.net < 0 ? '−' : '') + money(Math.abs(t.net)) : '–'}</td></tr>`).join('')}</tbody></table>` : ''}
  </section>${ui.popup === 'phist' && ui.histName ? playerHistPopup(ui.histName, games) : ''}`;
}
function playerHistPopup(name, games){
  const mine = games.filter(gm => gm.results.some(r => r.name === name));
  const tot = {R:0, D:0, M:0, F:0};
  mine.forEach(gm => { const r = gm.results.find(x => x.name === name); ['R','D','M','F'].forEach(k => tot[k] += r[k] || 0); });
  let best = 0, run = 0;
  [...mine].reverse().forEach(gm => { if (gm.winner === name){ run++; best = Math.max(best, run); } else run = 0; });
  return `<div class="modal" data-act="popup-close"><div class="modalbox" data-stop="1"><section class="glass panel tpanel">
    <div class="row spread"><h2>${esc(dn(name))} <small class="muted" style="font-size:12px;letter-spacing:0;text-transform:none">${esc(name)}</small></h2><button class="bb" data-act="popup-close">✕</button></div>
    <div class="pstats"><span class="s-R">R ${tot.R}</span><span class="s-D">D ${tot.D}</span><span class="s-M">MD ${tot.M}</span><span class="s-F">FC ${tot.F}</span><span>Best streak ${best}</span></div>
    <div class="hist">${mine.map(gm => { const r = gm.results.find(x => x.name === name); const m = (gm.money || []).find(x => x.name === name);
      const res = gm.winner === name ? '🏆 Won' : gm.split ? 'Split' : r.out ? 'Out' : gm.winner ? 'Lost' : '';
      return `<div><span>${new Date(gm.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})} · ${gm.rounds} rnds · ${res}</span><span class="${m && m.net > 0 ? 'pos' : m && m.net < 0 ? 'neg' : ''}">${m ? (m.net > 0 ? '+' : m.net < 0 ? '−' : '') + money(Math.abs(m.net)) : ''}</span></div>`; }).join('')}</div>
  </section></div></div>`;
}
function historyView(){
  if (!history.length) return '';
  return `<section class="glass panel tpanel"><button class="tablehead" data-act="sec-toggle" data-k="histOpen"><h2>Past games</h2><span class="row" style="gap:8px"><span class="hint">${history.length}</span><span class="chev">${ui.histOpen ? '▲' : '▼'}</span></span></button>${!ui.histOpen ? '' : `<div class="hist">${history.slice(0,10).map(h => `<div><span>${new Date(h.endedAt).toLocaleDateString(undefined,{day:'numeric',month:'short'})} · ${h.rounds} rounds</span><span>${h.winner ? '🏆 '+esc(dn(h.winner)) + (h.pot ? ' ' + money(h.pot) : '') : h.split ? 'Split: ' + h.split.map(r => esc(dn(r.name)) + ' ' + money(r.amt)).join(', ') : esc((h.results||[]).filter(r=>!r.out).map(r=>dn(r.name)).join(', ') || 'Unfinished')}</span></div>`).join('')}</div>`}</section>`;
}

// two players left: if one drops or middle-drops, the other gets Rummy automatically
function autoRummy(pid, val){
  const c = compute(game);
  if (val === '') return;
  const v = Number(val);
  // two players: a drop or middle drop hands the round to the other player
  if (c.active.length === 2 && (v === c.s.drop || v === c.s.mid)){
    const other = c.active.find(p => p.id !== pid);
    if (other){ draft[other.id] = '0'; ui.manual[other.id] = false; }
    return;
  }
  // any table: once everyone but one has a non-R score, the last player must be the winner
  const has = id => draft[id] !== undefined && draft[id] !== '';
  if (c.active.some(p => has(p.id) && Number(draft[p.id]) === 0)) return;
  const empty = c.active.filter(p => !has(p.id));
  if (empty.length === 1 && !ui.manual[empty[0].id]){ draft[empty[0].id] = '0'; }
}
function setDraft(pid, val){
  ui.msg = '';
  if (draft[pid] === val && val === '0'){ draft[pid] = ''; return; }
  draft[pid] = val;
  if (val !== '' && Number(val) === 0) for (const k of Object.keys(draft)) if (k !== pid && draft[k] !== '' && Number(draft[k]) === 0) draft[k] = '';
}

});

/* ---------- persistence: Google Sheets, with this phone as a backup ---------- */
// Sheet layout (tabs are created automatically on first sign-in):
//   Current!A1  the game being played (JSON)      Current!B1  when it was last changed
//   History     one row per finished game: Ended, Rounds, Winner, Pot, Final scores, Money, Data (JSON, used by the app)
const CFG = window.RUMMY_CONFIG || {};
const USE_SHEETS = !!(CFG.clientId && CFG.sheetId && !/PASTE/i.test(CFG.clientId + CFG.sheetId));
const API = 'https://sheets.googleapis.com/v4/spreadsheets/' + encodeURIComponent(CFG.sheetId || '');
const SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
const HIST_HEAD = ['Ended', 'Rounds', 'Winner', 'Pot', 'Final scores', 'Money', 'Data (do not edit)'];
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(_){ return null; } },
  set(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(_){} }
};
let token = null, tokenExp = 0, pushing = false, pushAgain = false, pollers = false;
const blankGame = () => ({players:[], log:[], settings:{}, startedAt:null});

function setAuth(v){ if (ui.auth !== v){ ui.auth = v; render(); } }
function setSync(state){ const err = state === 'error'; if (ui.syncErr !== err){ ui.syncErr = err; render(); } }

// coming back from Google sign-in: the pass (access token) arrives in the address #fragment
function readAuthReturn(){
  if (location.hash.length < 2) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token')){
    ls.set('rummy-token', JSON.stringify({v:h.get('access_token'), exp:Date.now() + (Number(h.get('expires_in')) || 3600) * 1000}));
    ls.set('rummy-signed', '1');
  } else if (h.get('error')) ls.set('rummy-autherr', h.get('error'));
  window.history.replaceState(null, '', location.pathname + location.search);
}
function loadToken(){
  try { const t = JSON.parse(ls.get('rummy-token') || 'null'); if (t && t.exp > Date.now() + 60000){ token = t.v; tokenExp = t.exp; return true; } } catch(_){}
  token = null; return false;
}
function signIn(silent){
  // keep anything half-typed so it survives the trip to Google and back
  ls.set('rummy-draft', JSON.stringify({draft, manual:ui.manual}));
  const p = new URLSearchParams({client_id:CFG.clientId, redirect_uri:location.origin + location.pathname, response_type:'token', scope:SCOPE, include_granted_scopes:'true'});
  if (silent) p.set('prompt', 'none');
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
}
function signOut(){
  if (token) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(token), {method:'POST'}).catch(() => {});
  ls.set('rummy-token', null); ls.set('rummy-signed', null); token = null; ui.auth = 'need'; render();
}
async function api(path, opts){
  if (!token || Date.now() > tokenExp - 30000){ token = null; setAuth('expired'); throw {status:401}; }
  let r;
  try { r = await fetch(API + path, Object.assign({}, opts || {}, {headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'}})); }
  catch(_){ throw {status:0}; }  // offline
  if (r.status === 401){ token = null; ls.set('rummy-token', null); setAuth('expired'); throw {status:401}; }
  if (!r.ok){ let m = ''; try { m = (await r.json()).error.message; } catch(_){} throw {status:r.status, message:m}; }
  return r.json();
}

function cacheLocal(){ ls.set('rummy-game', JSON.stringify(game)); }
function save(next){
  game = next; game.updatedAt = new Date().toISOString();
  render();
  if (!canWrite) return;
  cacheLocal();
  if (mode === 'sheets'){ ls.set('rummy-dirty', '1'); push(); }
}
async function push(){
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  try {
    do {
      pushAgain = false;
      await api('/values/Current!A1:B1?valueInputOption=RAW', {method:'PUT', body:JSON.stringify({values:[[JSON.stringify(game), game.updatedAt || '']]})});
    } while (pushAgain);
    ls.set('rummy-dirty', null); setSync('live');
  } catch(e){
    if (e.status === 403){ canWrite = false; ui.msg = 'You can view this game but not change it.'; render(); }
    else if (e.status !== 401){ setSync('error'); setTimeout(() => { if (ls.get('rummy-dirty')) push(); }, 5000); }
  } finally { pushing = false; }
}

function historyRow(rec){
  let json = JSON.stringify(rec);
  if (json.length > 45000){ const r2 = Object.assign({}, rec); delete r2.game; json = JSON.stringify(r2); }  // a cell holds 50,000 characters
  const when = new Date(rec.endedAt).toLocaleString('en-AU', {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'});
  const scores = rec.results.map(r => r.name + ' ' + (r.out ? 'OUT' : r.total)).join(', ');
  const cash = (rec.money || []).map(m => m.name + ' ' + (m.net > 0 ? '+' : m.net < 0 ? '-' : '') + 'A$' + Math.abs(Math.round(m.net))).join(', ');
  return [when, rec.rounds, rec.winner || (rec.split ? 'Split' : 'Unfinished'), rec.pot, scores, cash, json];
}
async function archive(g){
  if (!g || !g.log || !g.log.length) return;
  const c = compute(g);
  const rec = {endedAt:new Date().toISOString(), rounds:c.rounds, winner:c.winner ? c.winner.name : null, pot:pool(c), split:g.split || null,
    results:c.list.filter(p => p.inGame || p.rounds).map(p => ({name:p.name, total:p.total, out:p.out, rejoins:p.rejoins, R:p.R, D:p.D, M:p.M, F:p.F})), money:settlement(g, c), game:g};
  history.unshift(rec); history = history.slice(0, 300);
  ls.set('rummy-history', JSON.stringify(history));
  if (mode !== 'sheets') return;
  let q = []; try { q = JSON.parse(ls.get('rummy-archq') || '[]'); } catch(_){}
  q.push(historyRow(rec)); ls.set('rummy-archq', JSON.stringify(q));
  await flushArchive();
}
// finished games wait on this phone until they reach the History tab
async function flushArchive(){
  let q = []; try { q = JSON.parse(ls.get('rummy-archq') || '[]'); } catch(_){}
  if (!q.length) return;
  try {
    await api('/values/History!A:G:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', {method:'POST', body:JSON.stringify({values:q})});
    ls.set('rummy-archq', null);
  } catch(_){}
}

async function ensureTabs(){
  const meta = await api('?fields=sheets.properties.title');
  const have = (meta.sheets || []).map(s => s.properties.title);
  const need = ['Current', 'History'].filter(t => !have.includes(t));
  if (need.length) await api(':batchUpdate', {method:'POST', body:JSON.stringify({requests:need.map(title => ({addSheet:{properties:{title}}}))})});
  if (need.includes('History')) await api('/values/History!A1:G1?valueInputOption=RAW', {method:'PUT', body:JSON.stringify({values:[HIST_HEAD]})});
}
async function pullCurrent(first){
  if (ls.get('rummy-dirty')){ if (!pushing) push(); return; }  // this phone has changes the sheet hasn't got yet
  let r;
  try { r = await api('/values/Current!A1:B1'); } catch(e){ if (e.status !== 401) setSync('error'); return; }
  if (pushing || ls.get('rummy-dirty')) return;
  setSync('live');
  const cell = ((r.values || [])[0] || [])[0];
  let remote = null; try { remote = cell ? JSON.parse(cell) : null; } catch(_){}
  if (!remote) remote = blankGame();
  if (!first && (remote.updatedAt || '') === (game.updatedAt || '')) return;
  game = remote; if (!game.players) game.players = []; if (!game.log) game.log = []; if (!game.settings) game.settings = {};
  cacheLocal(); render();
}
async function pullHistory(){
  let r; try { r = await api('/values/History!G2:G'); } catch(_){ return; }
  const list = (r.values || []).map(row => { try { return JSON.parse(row[0]); } catch(_){ return null; } }).filter(x => x && x.endedAt);
  list.sort((a, b) => (a.endedAt < b.endedAt ? 1 : -1));
  const next = list.slice(0, 300);
  if (next.map(h => h.endedAt).join() === history.map(h => h.endedAt).join()) return;
  history = next; ls.set('rummy-history', JSON.stringify(history)); render();
}
async function connect(){
  try { await ensureTabs(); }
  catch(e){
    if (e.status === 403) canWrite = false;
    else if (e.status === 404 || e.status === 400){ setAuth('badsheet'); return; }
    else if (e.status !== 401) setSync('error');
  }
  await pullCurrent(true);
  await flushArchive();
  pullHistory();
  if (pollers) return; pollers = true;
  // other phones at the table see new rounds within a few seconds
  setInterval(() => { if (document.visibilityState === 'visible' && token && !ui.popup) pullCurrent(false); }, 4000);
  setInterval(() => { if (document.visibilityState === 'visible' && token) pullHistory(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && token){ pullCurrent(false); flushArchive(); } });
  window.addEventListener('online', () => { if (token){ pullCurrent(false); flushArchive(); } });
}

/* ---------- boot ---------- */
function bootLocal(){
  mode = 'local';
  try { game = JSON.parse(ls.get('rummy-game') || 'null'); } catch(_){ game = null; }
  try { history = JSON.parse(ls.get('rummy-history') || '[]'); } catch(_){ history = []; }
  if (!game) game = blankGame();
  render();
}
async function boot(){
  if (!USE_SHEETS){ bootLocal(); return; }
  mode = 'sheets';
  readAuthReturn();
  // show the last copy kept on this phone straight away
  try { game = JSON.parse(ls.get('rummy-game') || 'null'); } catch(_){ game = null; }
  try { history = JSON.parse(ls.get('rummy-history') || '[]'); } catch(_){ history = []; }
  if (!game) game = blankGame();
  try { const d = JSON.parse(ls.get('rummy-draft') || 'null'); if (d){ draft = d.draft || {}; ui.manual = d.manual || {}; } } catch(_){}
  ls.set('rummy-draft', null);
  if (!loadToken()){
    const err = ls.get('rummy-autherr'); ls.set('rummy-autherr', null);
    if (ls.get('rummy-signed') && !err){ signIn(true); return; }  // signed in before: quietly get a fresh pass from Google
    ui.auth = 'need'; render(); return;
  }
  ui.auth = 'ok'; render();
  await connect();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

})();
</script>
